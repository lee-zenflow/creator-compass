services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creator_compass
      POSTGRES_USER: creator_compass
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - creator_compass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator_compass -d creator_compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: creator_compass
      MINIO_ROOT_PASSWORD: creator-compass-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - creator_compass_minio:/data
  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 creator_compass creator-compass-local-secret; do sleep 1; done &&
      mc mb --ignore-existing local/creator-compass-private &&
      mc anonymous set none local/creator-compass-private"

volumes:
  creator_compass_postgres:
  creator_compass_minio:
